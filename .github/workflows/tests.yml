name: Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Package requires php ^8.1; PHP 8.6.0 is the latest stable
        # (released 19 Nov 2026: https://www.php.net/releases/8_6_0.php)
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, bcmath, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      # PHP 8.1 resolves to Laravel 10 / testbench 8. Composer currently blocks
      # every Laravel 10 release via security advisories, so allow install for CI.
      - name: Allow Laravel 10 installs on PHP 8.1
        if: matrix.php == '8.1'
        run: composer config audit.block-insecure false

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Show PHP and Composer versions
        run: |
          php -v
          composer --version

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
